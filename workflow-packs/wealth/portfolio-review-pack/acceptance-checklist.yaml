# Acceptance checklist for wealth portfolio review pack
checks:
  - id: OUTPUT-FILES-EXIST
    description: All required evidence, checklist, and run record files exist
    severity: error
  - id: EQUITY-ALLOCATION-CHECK
    description: Public equity allocation (26.2%) verifies within IPS 70.0% ceiling
    severity: error
  - id: IPS-BREACH-SURFACED
    description: Single stock position cap breaches (AAPL 6.5%, MSFT 7.2%) surfaced in review checklist
    severity: error
  - id: PORTFOLIO-YIELD-VERIFIED
    description: Weighted portfolio yield (3.4%) meets minimum target (3.2%)
    severity: error
  - id: BENCHMARK-COMPARISON-TRACKED
    description: Portfolio YTD return (+8.4%) is compared against 60/40 benchmark (+7.8%)
    severity: error
  - id: ADVISOR-REVIEW-ITEMS-FLAGGED
    description: Rebalancing recommendations and IPS breaches flagged for advisor sign-off
    severity: error
